services:
  - type: web
    name: voiceskill-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node build/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        fromDatabase:
          name: voiceskill-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: voiceskill-db
    plan: free
    databaseName: voice-skill-ecosystem
