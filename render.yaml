services:
  - type: web
    name: voiceskill-backend
    env: node
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: node server/build/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
